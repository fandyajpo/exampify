# CI (TESTING_STRATEGY.md §11, DEPLOYMENT_AND_ENVIRONMENTS.md §3.2).
#
# Every step here is a gate the docs name: frozen install, typecheck, lint, unit tests,
# migrate + seed an ephemeral libSQL database, and a production build under Bun. The
# placeholder environment is the minimum `lib/env.ts` accepts; no real secret is used.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: file:./.data/ci.db
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      QDRANT_URL: https://example.cloud.qdrant.io
      QDRANT_API_KEY: ci-placeholder
      QDRANT_COLLECTION: content_v1
      TIGRIS_BUCKET: exampify-ci
      TIGRIS_ENDPOINT: https://t3.storage.dev
      TIGRIS_ACCESS_KEY_ID: ci-placeholder
      TIGRIS_SECRET_ACCESS_KEY: ci-placeholder
      TIGRIS_PUBLIC_URL: https://media.example.com
      QSTASH_TOKEN: ci-placeholder
      QSTASH_CURRENT_SIGNING_KEY: ci-placeholder
      QSTASH_NEXT_SIGNING_KEY: ci-placeholder
      UPSTASH_REDIS_REST_URL: https://example.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      CRON_SECRET: ci-placeholder
      EMAIL_PROVIDER: stub
      EMAIL_SMTP_HOST: smtp.gmail.com
      EMAIL_SMTP_PORT: "465"
      EMAIL_SMTP_SECURE: tls
      EMAIL_SMTP_USER: no-reply@mail.example.com
      EMAIL_SMTP_PASS: ci-placeholder
      EMAIL_FROM: "Exampify <no-reply@mail.example.com>"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Docs consistency
        run: python3 docs/check.py

      # The contract is generated, so a schema change without regeneration fails here
      # exactly like a stale lockfile (API_CONTRACTS.md §16.2, MVP_ROADMAP §4.6).
      - name: Generated API document
        run: bun run openapi:check

      - name: Migrate and seed an ephemeral database
        run: |
          mkdir -p .data
          bun run db:migrate
          bun run db:seed

      - name: Build
        run: bun run build
